<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duplicate Tab Inspector v5.0.0</title>
    <link rel="icon" type="image/png" href="icons/icon-48.png" />
    <link rel="stylesheet" href="inspector.css" />
</head>
<body>
    <header class="sticky-header">
        <div class="header-inner">
            <div class="brand">
                <img src="icons/icon-48.png" alt="" class="brand-icon" />
                <div>
                    <h1>Duplicate Tab Inspector</h1>
                    <p id="summaryText" class="summary">Scanning tabs...</p>
                </div>
            </div>

            <div class="controls">
                <div class="segmented" role="group" aria-label="URL Matching Level">
                    <button type="button" class="seg-btn active" data-level="exact">Exact</button>
                    <button type="button" class="seg-btn" data-level="no-hash">No Hash</button>
                    <button type="button" class="seg-btn" data-level="path">Path</button>
                    <button type="button" class="seg-btn" data-level="domain">Domain</button>
                </div>

                <button type="button" id="captureAllBtn" class="bulk-btn">
                    <span class="btn-dot"></span>
                    <span id="captureBtnLabel">Capture Previews</span>
                </button>
            </div>
        </div>
    </header>

    <main id="groupsContainer" class="groups-container"></main>

    <script src="inspector.js"></script>
</body>
</html>
