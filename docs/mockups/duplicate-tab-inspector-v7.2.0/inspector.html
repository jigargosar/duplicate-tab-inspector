<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duplicate Tab Inspector</title>
  <link rel="stylesheet" href="inspector.css" />
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <img src="icons/icon-48.png" alt="" class="brand-icon" />
      <div class="brand-text">
        <div class="title-row">
          <h1>Duplicate Tab Inspector</h1>
          <span id="versionBadge" class="version-badge"></span>
        </div>
        <p id="summaryText" class="summary-text">Scanning open tabs…</p>
      </div>
    </div>

    <div class="controls">
      <div class="segmented" role="group" aria-label="URL matching level">
        <button type="button" class="seg-btn" data-mode="domain">Domain</button>
        <button type="button" class="seg-btn" data-mode="path">Path</button>
        <button type="button" class="seg-btn" data-mode="nohash">No Hash</button>
        <button type="button" class="seg-btn active" data-mode="exact">Exact</button>
      </div>

      <button type="button" id="captureBtn" class="capture-btn">Capture Previews</button>
    </div>
  </header>

  <main id="groupsContainer" class="groups-container"></main>

  <script src="inspector.js"></script>
</body>
</html>
